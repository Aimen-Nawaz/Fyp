[project]
name = "medicine_project"
version = "1.0.0"
requires-python = "3.11"
description = "Medicine name reconstruction API"
dependencies = [
    "tensorflow==2.15.0",
    "numpy==1.24.3",
    "python-Levenshtein==0.21.1",
    "flask==3.0.0",
    "flask-cors==4.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
