[project]
name = "medicine_project"
version = "1.0.0"
requires-python = ">=3.12" 
description = "Medicine name reconstruction API"
dependencies = [
    "tensorflow==2.16.1",
    "numpy>=1.26.0,<2.0.0",
    "python-Levenshtein==0.21.1",
    "flask==3.0.0",
    "flask-cors==4.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
